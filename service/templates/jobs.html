{% extends "base.html" %}
{% block title %}Jobs — audioreap{% endblock %}

{% block content %}
<div class="page-toolbar">
  <h2 class="page-title">Jobs</h2>
  <div style="display:flex;gap:8px">
    <button class="btn btn-ghost btn-sm"
            hx-get="/jobs/list"
            hx-target="#job-list"
            hx-indicator="#refresh-spin">
      Refresh <span id="refresh-spin" class="htmx-indicator"><span class="spinner"></span></span>
    </button>
    <button class="btn btn-ghost btn-sm"
            hx-delete="/jobs/clear"
            hx-target="#job-list"
            style="color:var(--muted)">
      Clear done
    </button>
  </div>
</div>

<div id="job-list">
  {% include "partials/job_list.html" %}
</div>
{% endblock %}

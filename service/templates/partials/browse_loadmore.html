<div id="browse-more-btn"
     hx-get="/library/browse/results?offset={{ next_offset }}&q={{ q|urlencode }}&f={{ f|urlencode }}&sort={{ sort|urlencode }}"
     hx-trigger="click"
     hx-target="#browse-more-btn"
     hx-swap="outerHTML"
     hx-indicator="#browse-more-btn"
     style="padding:16px 0;text-align:center">
  <button class="btn btn-ghost" style="font-size:13px">
    Load more
    <span class="htmx-indicator"><span class="spinner"></span></span>
  </button>
</div>

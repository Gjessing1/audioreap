{% if tracks %}
<div class="browse-header-row">
  <span style="font-size:12px;color:var(--t3)">{{ tracks|length }} track{% if tracks|length != 1 %}s{% endif %}</span>
</div>
<div class="browse-list">
  {% for t in tracks %}
  {% include "partials/browse_row.html" %}
  {% endfor %}
</div>
{% elif q or f %}
<p class="empty" style="text-align:left;padding:24px 0">No tracks match this filter.</p>
{% else %}
<p class="empty" style="text-align:left;padding:24px 0">No tracks in library yet.</p>
{% endif %}

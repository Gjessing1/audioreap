{% if error %}
<p class="search-loading" role="status">{{ error }} <button class="btn btn-sm btn-ghost" hx-get="/search/artists?q={{ q|urlencode }}" hx-target="#search-artists">Try again</button></p>
{% elif artists %}
{% set artist_search_mode = 'unified' %}
{% include "partials/artist_matches.html" %}
{% else %}
<p class="search-loading">No artist matches for “{{ q }}”. Track results are below.</p>
{% endif %}

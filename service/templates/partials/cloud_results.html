{% if candidates %}
{% for c in candidates %}
<div class="card" id="cloud-{{ loop.index }}">
  <div class="card-info">
    <div class="card-title">{{ c.title }}</div>
    <div class="card-sub">
      {{ c.artist }}
      {% if c.duration_seconds %}
        · {{ c.duration_seconds // 60 }}:{{ '%02d' % (c.duration_seconds % 60) }}
      {% endif %}
    </div>
  </div>
  <div class="card-actions">
    <a href="{{ c.provider_ref }}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Preview ↗</a>
    <button class="btn btn-sm"
            hx-post="/api/acquire"
            hx-vals='js:{"provider_name":"ytdlp","provider_ref":this.dataset.ref,"candidate_json":this.dataset.json,"query":this.dataset.query}'
            hx-target="#cloud-{{ loop.index }}"
            hx-swap="outerHTML"
            data-ref="{{ c.provider_ref|e }}"
            data-json="{{ c.candidate_json|e }}"
            data-query="{{ q|e }}">
      Acquire
    </button>
  </div>
</div>
{% endfor %}
{% elif q %}
<p class="empty">No results found on YouTube for "{{ q }}".</p>
{% endif %}

services:
  navidrome:
    image: deluan/navidrome:latest
    container_name: navidrome
    user: 1000:1000
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
    volumes:
      # Navidrome database, cache, config
      - /mnt/data/navidrome:/data

      # Music library (read-only)
      - /mnt/data/media/music:/music:ro

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A0C12" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg">
  <link rel="manifest" href="/static/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/static/icons/icon.svg">
  <!-- Apply saved theme before first paint to avoid a flash of the wrong mode -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('ar-theme');
        if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/static/app.css">
  <title>{% block title %}audioreap{% endblock %}</title>
</head>
<body>
<nav id="main-nav">
  <a href="/acquire" class="brand">audioreap</a>
  <button class="theme-btn" id="theme-btn" type="button" aria-label="Toggle theme" title="Theme">◐</button>
  <button class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round">
      <line x1="1" y1="4" x2="15" y2="4"/>
      <line x1="1" y1="8" x2="15" y2="8"/>
      <line x1="1" y1="12" x2="15" y2="12"/>
    </svg>
  </button>
  <div class="nav-links" id="nav-links">
    <a href="/acquire"   {% if active == 'acquire'  %}class="active"{% endif %}>Acquire</a>
    <a href="/jobs"      {% if active == 'jobs'      %}class="active"{% endif %}>
      Jobs <span hx-get="/nav/review-count" hx-trigger="load, every 30s" hx-swap="outerHTML"></span>
    </a>
    <a href="/library"   {% if active == 'library'   %}class="active"{% endif %}>
      Library <span hx-get="/nav/attention-count" hx-trigger="load, every 120s" hx-swap="outerHTML"></span>
    </a>
    <a href="/admin/config" {% if active == 'settings' %}class="active"{% endif %} title="Runtime configuration">Settings</a>
  </div>
</nav>

<main>{% block content %}{% endblock %}</main>

<div id="player-bar" class="hidden">
  <div id="player-art" class="hidden">
    <img id="player-art-img" alt="">
  </div>
  <div id="player-info">
    <span id="player-title">—</span>
  </div>
  <div id="player-controls">
    <button id="player-prev" class="player-btn player-skip hidden" title="Previous in list">⏮︎</button>
    <button id="player-play" class="player-btn">▶</button>
    <button id="player-next" class="player-btn player-skip hidden" title="Next in list">⏭︎</button>
    <input id="player-progress" type="range" min="0" max="100" value="0" step="0.1">
  </div>
</div>
<audio id="audio-el" preload="none"></audio>

<script src="/static/htmx.min.js"></script>
<script src="/static/app.js"></script>
<script>
  const toggle = document.getElementById('nav-toggle');
  const nav    = document.getElementById('main-nav');
  const links  = document.getElementById('nav-links');
  toggle.addEventListener('click', () => {
    const open = nav.classList.toggle('nav-open');
    toggle.setAttribute('aria-expanded', String(open));
  });
  links.querySelectorAll('a').forEach(a =>
    a.addEventListener('click', () => nav.classList.remove('nav-open'))
  );

  // Theme toggle: cycle auto → dark → light → auto. "auto" follows the OS.
  (function () {
    const KEY   = 'ar-theme';
    const CYCLE = { auto: 'dark', dark: 'light', light: 'auto' };
    const ICONS = { auto: '◐', dark: '☾', light: '☀' };
    const btn   = document.getElementById('theme-btn');
    const get   = () => localStorage.getItem(KEY) || 'auto';
    function apply(theme) {
      if (theme === 'auto') delete document.documentElement.dataset.theme;
      else document.documentElement.dataset.theme = theme;
      try { localStorage.setItem(KEY, theme); } catch (e) {}
      if (btn) { btn.textContent = ICONS[theme]; btn.title = 'Theme: ' + theme; }
    }
    apply(get());
    if (btn) btn.addEventListener('click', () => apply(CYCLE[get()]));
  })();
</script>
</body>
</html>

{% if results %}
<div class="mb-candidates">
  {% for rec in results %}
  <div class="mb-candidate">
    <div class="mb-candidate-info">
      <div class="mb-candidate-title">{{ rec.title }}</div>
      <div class="mb-candidate-sub">
        {{ rec.artist }}{% if rec.album %} · {{ rec.album }}{% endif %}{% if rec.year %} · {{ rec.year }}{% endif %}
      </div>
      <div class="mb-candidate-id">{{ rec.recording_id }}</div>
    </div>
    <button class="btn btn-ghost btn-sm"
            hx-post="/jobs/{{ job_id }}/mb-apply"
            hx-vals='{"recording_id": "{{ rec.recording_id }}"}'
            hx-target="#job-{{ job_id }}"
            hx-swap="outerHTML">Use</button>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="muted" style="margin-top:8px;font-size:13px">No results. Try a different search.</p>
{% endif %}

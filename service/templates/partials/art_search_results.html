{% if results %}
<div style="display:flex;flex-wrap:wrap;gap:8px;padding:4px 0">
  {% for r in results %}
  <div style="position:relative;width:80px;cursor:pointer" class="art-choice"
       data-full="{{ r.full|e }}"
       onclick="pickArt(this)"
       title="{{ r.label }} ({{ r.source }})">
    <img src="{{ r.thumb|e }}"
         loading="lazy"
         style="width:80px;height:80px;object-fit:cover;border-radius:4px;border:2px solid var(--b1);display:block"
         onerror="this.closest('.art-choice').style.display='none'">
    <div style="font-size:9px;color:var(--t3);text-align:center;margin-top:2px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">
      {{ r.source }}
    </div>
  </div>
  {% endfor %}
</div>
{% else %}
<p class="empty" style="font-size:12px;padding:8px 0">No results.</p>
{% endif %}

{% if candidates %}
{% for c in candidates %}
<div class="card" id="cloud-{{ loop.index }}">
  <div class="card-info">
    <div class="card-title">{{ c.title }}</div>
    <div class="card-sub">
      {{ c.artist }}
      {% if c.duration_seconds %}
        · {{ c.duration_seconds // 60 }}:{{ '%02d' % (c.duration_seconds % 60) }}
      {% endif %}
    </div>
  </div>
  <div class="card-actions">
    <a href="{{ c.provider_ref }}" target="_blank" rel="noopener" class="btn btn-ghost btn-sm">Preview ↗</a>
    <form hx-post="/api/acquire"
          hx-target="#cloud-{{ loop.index }}"
          hx-swap="outerHTML"
          style="display:contents">
      <input type="hidden" name="provider_name" value="ytdlp">
      <input type="hidden" name="provider_ref" value="{{ c.provider_ref|e }}">
      <input type="hidden" name="candidate_json" value="{{ c.candidate_json|e }}">
      <input type="hidden" name="query" value="{{ q|e }}">
      <button type="submit" class="btn btn-sm">Acquire</button>
    </form>
  </div>
</div>
{% endfor %}
{% elif q %}
<p class="empty">No results found on YouTube for "{{ q }}".</p>
{% endif %}
